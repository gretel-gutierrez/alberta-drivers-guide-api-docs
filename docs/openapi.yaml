openapi: 3.1.0
info:
  title: Alberta Drivers Guide API
  version: 1.0.0

paths:
  /api/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mail, pass, accept_terms]
              properties:
                name:
                  type: string
                  description: Username (unique).
                mail:
                  type: string
                  format: email
                  description: User email (unique).
                pass:
                  type: string
                  description: User password.
                full_name:
                  type: string
                  description: Full name (optional).
                language:
                  type: string
                  description: Preferred language.
                  enum: [en, es, fr]
                accept_terms:
                  type: boolean
                  description: Must be true to complete registration.
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  mail:
                    type: string
                  full_name:
                    type: string
                  language:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string

  /oauth2/token:
    post:
      summary: Obtain OAuth2 access token
      tags:
        - Authentication
      security:
        - basicAuth: []   # client_id / client_secret
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, username, password]
              properties:
                grant_type:
                  type: string
                  enum: [password]
                  example: password
                username:
                  type: string
                  example: apiuser
                password:
                  type: string
                  format: password
                  example: "********"
      responses:
        "200":
          description: Access token granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
        "400":
          description: Invalid request or credentials
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
