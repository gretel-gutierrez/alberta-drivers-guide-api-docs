openapi: 3.1.0
info:
  title: Alberta Drivers Guide API
  version: 1.0.0

paths:
  /api/register:
    post:
      summary: Register a new user
      description: |
        Creates a new user account in the system.
        Performs validation for:
        - Unique email and username.
        - Password strength (min 8 chars, uppercase, lowercase, number, special char).
        - Valid email format.
        - Acceptance of terms and conditions.
        - Rate limiting (max 5 attempts per hour).
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, mail, pass, accept_terms]
              properties:
                name:
                  type: string
                  description: Username (unique).
                mail:
                  type: string
                  format: email
                  description: User email (unique).
                pass:
                  type: string
                  description: User password.
                full_name:
                  type: string
                  description: Full name (optional).
                language:
                  type: string
                  description: Preferred language.
                  enum: [en, es, fr]
                accept_terms:
                  type: boolean
                  description: Must be true to complete registration.
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  mail:
                    type: string
                  full_name:
                    type: string
                  language:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Too many registration attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string

  /oauth2/token:
    post:
      summary: Obtain OAuth2 access token
      description: |
        Authenticates a user and returns an access token (Bearer Token).
        Requires a valid `client_id` and `client_secret` provided via Basic Auth header or body parameters.
        This endpoint is provided by the Drupal Simple OAuth module.
      tags:
        - Authentication
      security:
        - basicAuth: []   # client_id / client_secret
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type, username, password]
              properties:
                grant_type:
                  type: string
                  enum: [password]
                  example: password
                username:
                  type: string
                  example: apiuser
                password:
                  type: string
                  format: password
                  example: "********"
      responses:
        "200":
          description: Access token granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
                  refresh_token:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '409':
          description: Account already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
        '429':
          description: Too many registration attempts
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string

  /api/training/{category}:
    get:
      summary: Get training content by category
      description: |
        Retrieves a list of training contents filtered by the specified category slug.
        Requires a valid Bearer token and the 'app_user' role.
      tags:
        - Training
      security:
        - bearerAuth: [ ]
      parameters:
        - in: path
          name: category
          schema:
            type: string
          required: true
          description: The URL-friendly slug of the category (e.g., 'pedestrian-signs').
      responses:
        '200':
          description: A list of training content items.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: The node ID.
                    title:
                      type: string
                      description: The training content title.
                    category:
                      type: string
                      description: The human-readable category name.
                    description:
                      type: string
                      description: HTML description of the training content.
        '401':
          description: Unauthorized (Invalid or missing token).
        '403':
          description: Forbidden (User lacks 'app_user' role).
        '404':
          description: Category not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: category_not_found
                  message:
                    type: string
                    example: Training category "invalid-slug" not found.

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
